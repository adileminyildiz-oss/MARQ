# ============================================================================
# Mar'q — Déploiement automatique vers l'hébergement IONOS
# ----------------------------------------------------------------------------
# À chaque push sur "main", les fichiers du site sont envoyés en SFTP dans
# l'espace web IONOS relié à marq.aemconseil.eu.
#
# À CONFIGURER UNE FOIS dans GitHub :
#   Dépôt → Settings → Secrets and variables → Actions → New repository secret
#     IONOS_SFTP_HOST     = l'hôte SFTP donné par IONOS (ex. accessXXXX.webspace-data.io)
#     IONOS_SFTP_USER     = l'identifiant SFTP IONOS
#     IONOS_SFTP_PASSWORD = le mot de passe SFTP IONOS
#     IONOS_REMOTE_PATH   = le dossier du site (ex. / ou /marq/ — le dossier relié au domaine)
#
# (Ces valeurs se trouvent dans IONOS → Hébergement → SFTP/SSH.)
# ============================================================================
name: Déploiement IONOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permet un déclenchement manuel depuis l'onglet Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Les secrets SFTP n'ont jamais été renseignés : l'action échouait alors sur
      # « remote_path is empty », et CHAQUE commit portait une croix rouge. Un
      # échec permanent ne signale plus rien — il masque les vrais. On s'abstient
      # proprement tant que la configuration manque.
      - name: Configuration IONOS présente ?
        id: config
        env:
          H: ${{ secrets.IONOS_SFTP_HOST }}
          U: ${{ secrets.IONOS_SFTP_USER }}
          P: ${{ secrets.IONOS_SFTP_PASSWORD }}
          R: ${{ secrets.IONOS_REMOTE_PATH }}
        run: |
          if [ -n "$H" ] && [ -n "$U" ] && [ -n "$P" ] && [ -n "$R" ]; then
            echo "prete=oui" >> "$GITHUB_OUTPUT"
          else
            echo "prete=non" >> "$GITHUB_OUTPUT"
            echo "Secrets IONOS absents — envoi ignoré." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Le site est publié par **GitHub Pages** (fichier CNAME → marq.aemconseil.eu)." >> "$GITHUB_STEP_SUMMARY"
            echo "Renseignez IONOS_SFTP_HOST, IONOS_SFTP_USER, IONOS_SFTP_PASSWORD et" >> "$GITHUB_STEP_SUMMARY"
            echo "IONOS_REMOTE_PATH pour activer cette seconde publication, ou supprimez" >> "$GITHUB_STEP_SUMMARY"
            echo "ce workflow si IONOS n'est plus utilisé." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Préparer le dossier de publication (fichiers du site uniquement)
        if: steps.config.outputs.prete == 'oui'
        run: |
          mkdir -p dist
          cp index.html sw.js version.json .htaccess dist/
          ls -la dist

      - name: Envoyer sur IONOS (SFTP)
        if: steps.config.outputs.prete == 'oui'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:      ${{ secrets.IONOS_SFTP_HOST }}
          username:    ${{ secrets.IONOS_SFTP_USER }}
          password:    ${{ secrets.IONOS_SFTP_PASSWORD }}
          port:        22
          local_path:  './dist/*'
          remote_path: ${{ secrets.IONOS_REMOTE_PATH }}
          sftp_only:   true
