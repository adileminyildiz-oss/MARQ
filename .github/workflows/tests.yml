name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérification de la syntaxe des scripts inline
        run: |
          node -e '
          const fs=require("fs");
          const s=fs.readFileSync("index.html","utf8");
          const re=/<script(\s[^>]*)?>([\s\S]*?)<\/script>/g;
          let m,n=0,bad=0;
          while((m=re.exec(s))){ if(m[1]&&/src=/.test(m[1]))continue; n++; try{new Function(m[2]);}catch(e){bad++;console.log("BAD script #"+n+": "+e.message);} }
          console.log("scripts "+n+" · erreurs "+bad);
          process.exit(bad?1:0);'

      - name: Cohérence de version (badge / version.json / service worker)
        run: node tests/version.mjs

      - name: Installation de Playwright (Chromium)
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: Suite de non-régression
        run: node tests/regression.mjs

      - name: Documents remplissables (docs + fiche de paie exacte + calibration + auto-remplissage)
        run: node tests/pdffill.mjs

      - name: Suites par module (tests/*.mjs)
        run: |
          echec=0
          for f in tests/*.mjs; do
            case "$(basename "$f")" in
              regression.mjs|pdffill.mjs|portal.mjs) continue ;;  # lancées à part
            esac
            if node "$f" > /tmp/sortie.txt 2>&1; then
              echo "  ok  $(basename "$f" .mjs) : $(tail -1 /tmp/sortie.txt)"
            else
              echo "  ÉCHEC $(basename "$f" .mjs)"; tail -20 /tmp/sortie.txt; echec=1
            fi
          done
          exit $echec

      - name: Suites d'interface (tests/ui/)
        run: node tests/ui/lancer.mjs

      - name: Serveur portail — tests smoke
        working-directory: server/portal
        env:
          CABINET_TOKEN: ci-token
          JWT_SECRET: ci-jwt
          DATA_DIR: ${{ runner.temp }}/marq-smoke
        run: npm run smoke

      - name: Portail client — test de bout en bout (serveur + front)
        run: node tests/portal.mjs
