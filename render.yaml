# Déploiement en un clic sur Render (https://render.com)
# 1) Poussez ce dépôt sur GitHub.
# 2) Render → New → Blueprint → sélectionnez le dépôt.
# 3) Render lit ce fichier, crée le service, génère les secrets, monte le disque.
# 4) Renseignez ALLOWED_ORIGIN avec l'URL EXACTE de votre site (front Mar'q).
#
# Note : le disque persistant nécessite un plan payant (Starter). En plan gratuit,
# retirez la section « disk » — les fichiers seront alors éphémères (repartez
# d'une resynchronisation après chaque redéploiement).
#
# IMPORTANT depuis v714 : ce service reçoit aussi les SAUVEGARDES du cabinet
# (/admin/backup, sous DATA_DIR/backups). Sans disque persistant, elles
# disparaissent à chaque redéploiement — ce qui vide la sauvegarde hors machine
# de son sens. Gardez la section « disk ».
#
# Après déploiement, contrôlez le service de l'extérieur :
#   CABINET_TOKEN=<le secret> node server/portal/scripts/verifier-deploiement.mjs \
#     https://<votre-service>.onrender.com --origine https://marq.aemconseil.eu
services:
  - type: web
    name: marq-portail
    runtime: node
    rootDir: server/portal
    plan: starter
    region: frankfurt
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CABINET_TOKEN
        generateValue: true      # secret d'administration (à coller aussi dans Mar'q)
      - key: JWT_SECRET
        generateValue: true      # secret de signature des sessions client
      # L'origine EXACTE du site Mar'q. Toute autre valeur fait démarrer un
      # service en apparence sain dont le navigateur refuse chaque appel :
      # le contrôle CORS échoue et rien ne remonte côté cabinet.
      # Plusieurs origines se séparent par des virgules.
      - key: ALLOWED_ORIGIN
        value: https://marq.aemconseil.eu
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_TTL
        value: "7200"
    disk:
      name: marq-data
      mountPath: /var/data
      sizeGB: 1
